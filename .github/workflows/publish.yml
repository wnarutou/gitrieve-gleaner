name: Publish Chrome Extension

on:
  push:
    tags:
      - "v*"          # 打 v* tag 触发发布
  workflow_dispatch:  # 也支持手动触发

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync manifest version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          export VERSION

          node -e "const fs = require('fs'); const path = 'chrome-extension/manifest.json'; const version = process.env.VERSION; const parts = version.split('.'); const valid = /^(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*)){0,3}$/.test(version) && parts.every((part) => Number(part) <= 65535) && parts.some((part) => Number(part) !== 0); if (!valid) { console.error('Invalid Chrome extension version from tag: ' + process.env.GITHUB_REF_NAME); process.exit(1); } const manifest = JSON.parse(fs.readFileSync(path, 'utf8')); manifest.version = version; fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n'); console.log('Using Chrome extension version ' + version);"

      - name: 打包扩展
        run: |
          cd chrome-extension
          zip -r ../extension.zip . \
            -x "node_modules/*" \
            -x "src/utils/test.js"

      - name: 上传并发布到 Chrome Web Store
        uses: wdzeng/chrome-extension@v2
        with:
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          publisher-id: ${{ secrets.CHROME_PUBLISHER_ID }}
          zip-path: extension.zip
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
